<rect x="120" y="950" width="1360" height="70" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="800.0" y="984" font-family="Microsoft YaHei, Arial" font-size="17" fill="#0f172a" text-anchor="middle">
