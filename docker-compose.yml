services:
  mysql:
    image: mysql:8.4
    container_name: library-system-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-library_system}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-library_root_password}
      MYSQL_USER: ${MYSQL_USER:-library_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-library_app_password}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - library-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: library-system-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-library_system}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${MYSQL_USER:-library_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-library_app_password}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      LIBRARY_DEFAULT_ADMIN_PASSWORD: ${LIBRARY_DEFAULT_ADMIN_PASSWORD:-123456}
      LIBRARY_DEFAULT_READER_PASSWORD: ${LIBRARY_DEFAULT_READER_PASSWORD:-123456}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  library-mysql-data:
