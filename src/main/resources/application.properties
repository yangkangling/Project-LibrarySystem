# 服务端口和应用名。
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}
spring.application.name=library-system

# MySQL 连接配置。生产和 Docker 环境通过环境变量注入，不在仓库里保存真实密码。
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/library_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA 表结构策略。演示环境默认 update，正式部署建议设置为 validate 并使用迁移工具管理 DDL。
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# 容量和规则配置。
library.max-active-borrow-count=${LIBRARY_MAX_ACTIVE_BORROW_COUNT:3}
library.max-page-size=${LIBRARY_MAX_PAGE_SIZE:100}
library.repair-legacy-data-on-startup=${LIBRARY_REPAIR_LEGACY_DATA_ON_STARTUP:false}
library.default-admin-password=${LIBRARY_DEFAULT_ADMIN_PASSWORD:123456}
library.default-reader-password=${LIBRARY_DEFAULT_READER_PASSWORD:123456}

# 连接池配置，提升多用户同时访问时的数据库连接复用能力。
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:30000}
